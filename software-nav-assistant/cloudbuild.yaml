# Division of responsibilities between the two deploy sources:
#   - Cloud Build (this file) only lints/tests, builds the container image,
#     pushes it, and points the Cloud Run service at the new image.
#   - Terraform (infra/terraform) owns the full service configuration:
#     environment variables, secret bindings, Cloud SQL attachment, scaling,
#     and invoker IAM policy.
# Do NOT add --set-env-vars / --set-secrets / --[no-]allow-unauthenticated
# here: gcloud replaces the whole env/secret set on every deploy, which wipes
# everything Terraform injected and makes the two sources fight each other.
steps:
  - name: node:20
    entrypoint: npm
    args:
      - ci

  - name: node:20
    entrypoint: npm
    args:
      - run
      - lint

  - name: node:20
    entrypoint: npm
    args:
      - test

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed

substitutions:
  _SERVICE: mobile-agent-api
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/mobile-agent/mobile-agent-api:latest
